name: Deploy Admin Frontend

on:
  push:
    branches:
      - test  # Cambia a 'main' o 'master' si lo prefieres

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Usa la versión que tengas en local

      - name: Instalar dependencias
        run: npm install

      - name: Compilar el proyecto (Build)
        run: npm run build
        # Si usas variables de entorno para la API, descomenta las líneas:
        # env:
        #   VITE_API_URL: ${{ secrets.PROD_API_URL }}

      - name: Subir a cPanel vía FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/   # Directorio generado por Vite (o el que uses)
          server-dir: ./       # Raíz de la cuenta FTP (ya apunta a /home/certfliu/admin-test.certimet.pe)